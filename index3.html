<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/*LOGIC*/
const CATS=['Alimentation','Restaurants','Transport','Logement','Abonnements','Loisirs','Voyages','Santé','Shopping','Autre'];
const CAT_COL=['#2E9E83','#E08A3C','#4C7FD0','#8E6BC4','#D9577A','#C9A227','#3FA7C9','#7BAE3F','#B0643C','#7A8A84'];
const CAT_RULES=[
 ['Abonnements',/netflix|spotify|disney|prime video|amazon prime|apple\.com|icloud|youtube|deezer|canal\+|abonnement|basic.?fit|fitness|salle de sport|chatgpt|openai|notion|adobe|gym/],
 ['Voyages',/airbnb|booking|hotel|hôtel|ryanair|easyjet|air france|vueling|lufthansa|hostel|expedia|voyage|trip/],
 ['Santé',/pharmac|doctolib|medecin|médecin|dentiste|optic|mutuelle|sant[eé]|hopital|hôpital|clinique/],
 ['Restaurants',/restau|resto|mcdo|mcdonald|burger|pizza|sushi|kebab|brasserie|bistro|caf[eé]|starbucks|boulangerie|uber ?eats|deliveroo|just ?eat|le zinc|chez /],
 ['Alimentation',/carrefour|leclerc|lidl|aldi|auchan|monoprix|franprix|intermarch|picard|biocoop|supermarch|courses|grocery|spar\b/],
 ['Transport',/\buber\b(?! ?eats)|bolt|sncf|ratp|navigo|ouigo|flixbus|blablacar|essence|parking|v[eé]lib|\blime\b|trainline|transport|taxi|m[eé]tro|shell|total ?energies/],
 ['Logement',/loyer|edf|engie|\beau\b|internet|free mobile|orange|sfr|bouygues|assurance hab|ikea|leroy merlin|castorama|electricit|rent\b/],
 ['Loisirs',/cin[eé]ma|ugc|path[eé]|concert|ticket|fnac|steam|playstation|nintendo|bowling|escape|mus[eé]e|th[eé][aâ]tre|fever|decathlon/],
 ['Shopping',/zara|h&m|amazon|zalando|vinted|asos|nike|adidas|uniqlo|shein|cdiscount|apple store|boulanger|darty|sephora/]
];
const normH=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const normKey=s=>normH(s).replace(/[0-9]+/g,' ').replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).join(' ');
function categorize(desc,learn){const k=normKey(desc);if(learn&&learn[k])return learn[k];const l=String(desc||'').toLowerCase();for(const[c,r]of CAT_RULES)if(r.test(l))return c;return'Autre'}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((toD(a)-toD(b))/864e5);
const weekStart=s=>{const d=toD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const monthStart=s=>s.slice(0,8)+'01';
const addMonths=(s,n)=>{const d=toD(monthStart(s));d.setMonth(d.getMonth()+n);return ymd(d)};
const dim=s=>{const d=toD(monthStart(s));d.setMonth(d.getMonth()+1);d.setDate(0);return d.getDate()};
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt={',':0,';':0,'\t':0};for(const ch of first)if(ch in cnt)cnt[ch]++;
  const d=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows}
function parseNum(s){if(s==null)return NaN;s=String(s).replace(/[\s\u00A0€$£]/g,'');if(s==='')return NaN;
  if(/,/.test(s)&&/\./.test(s)){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(/,/.test(s))s=s.replace(',','.');
  return parseFloat(s)}
function parseDate(s){s=String(s||'');let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null}
function detectSource(H){
  if(H.some(x=>/completed date|date de fin|started date|date de debut/.test(x)))return'revolut';
  if(H.some(x=>/paid by|paye par|payeur|qui a paye/.test(x)))return'tricount';return null}
function rateOf(cur,S,warn){cur=(cur||'EUR').toUpperCase();if(cur==='EUR')return 1;if(S.rates[cur]==null){S.rates[cur]=1;warn.push(cur)}return S.rates[cur]}
function importText(text,hint,S){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('fichier vide ou illisible');
  const hi=rows.findIndex(r=>r.filter(x=>x.trim()).length>=3);if(hi<0)throw new Error('en-têtes introuvables');
  const head=rows[hi].map(x=>x.trim()),H=head.map(normH);
  const src=hint&&hint!=='auto'?hint:detectSource(H);if(!src)throw new Error('format non reconnu, choisis la source manuellement');
  const idx=res=>H.findIndex(h=>res.some(r=>r.test(h)));
  const iDesc=idx([/^description$/,/^title$/,/^titre$/,/^libelle$/,/^objet$/]),iAmt=idx([/^amount$/,/^montant$/,/^montant total$/]);
  const iCur=idx([/^currency$/,/^devise$/]),iType=idx([/^type$/]);
  const iDate=src==='revolut'?idx([/completed date/,/date de fin/,/^date$/,/started date/,/date de debut/]):idx([/^date$/,/^date de /]);
  if(iDate<0||iAmt<0||iDesc<0)throw new Error('colonnes date, description ou montant introuvables');
  const warn=[];const counts={};const existing=new Set(S.tx.map(t=>t.id));let added=0,skipped=0;
  if(src==='revolut'){
    const iFee=idx([/^fee$/,/^frais$/]),iState=idx([/^state$/,/^etat$/,/^statut$/]);
    for(const r of rows.slice(hi+1)){
      const type=iType>=0?String(r[iType]).toUpperCase():'',state=iState>=0?String(r[iState]).toUpperCase():'';
      const date=parseDate(r[iDate]),amount=parseNum(r[iAmt]),fee=iFee>=0?(parseNum(r[iFee])||0):0,desc=(r[iDesc]||'').trim();
      if(!date||isNaN(amount)||amount>=0||/EXCHANGE|TOPUP/.test(type)||/REVERTED|DECLINED|FAILED/.test(state)||/pocket|poche|vault|coffre/i.test(desc)){skipped++;continue}
      const cur=iCur>=0?r[iCur].trim():'EUR',k=rateOf(cur,S,warn),amt=Math.round((Math.abs(amount)+Math.abs(fee))*k*100)/100;
      const base='revolut|'+date+'|'+desc.toLowerCase()+'|'+amt.toFixed(2);counts[base]=(counts[base]||0)+1;const id=base+'#'+counts[base];
      if(existing.has(id)){skipped++;continue}
      S.tx.push({id,src:'revolut',date,desc,amt,cur,fee:Math.round(Math.abs(fee)*k*100)/100,cat:categorize(desc,S.learn),ex:false,dup:false});existing.add(id);added++}
  }else{
    const iPaid=idx([/paid by/,/paye par/,/payeur/]);
    const known=/^(title|titre|description|libelle|objet|amount|montant|currency|devise|exchange|taux|rate|paid|paye|payeur|date|category|categorie|type|note|notes|id|nb|number)/;
    const parts=head.map((h,j)=>j).filter(j=>!known.test(H[j])&&H[j]&&rows.slice(hi+1).some(r=>!isNaN(parseNum(r[j]))));
    const meN=normH(S.me);let iMe=meN?parts.find(j=>H[j].includes(meN)):undefined;if(iMe===undefined)iMe=-1;
    for(const r of rows.slice(hi+1)){
      const date=parseDate(r[iDate]),total0=parseNum(r[iAmt]),desc=(r[iDesc]||'').trim(),type=iType>=0?normH(r[iType]):'';
      if(!date||isNaN(total0)||total0<=0||/rembours|reimburs|transfer|balance/.test(type)){skipped++;continue}
      const cur=iCur>=0?r[iCur].trim():'EUR',k=rateOf(cur,S,warn),total=Math.round(total0*k*100)/100;
      let share;
      if(iMe>=0&&!isNaN(parseNum(r[iMe])))share=Math.abs(parseNum(r[iMe]))*k;
      else if(parts.length){const n=parts.filter(j=>!isNaN(parseNum(r[j]))&&parseNum(r[j])!==0).length||parts.length;share=total/n}
      else share=total;
      const amt=Math.round(share*100)/100;
      const base='tricount|'+date+'|'+desc.toLowerCase()+'|'+total.toFixed(2)+'|'+amt.toFixed(2);counts[base]=(counts[base]||0)+1;const id=base+'#'+counts[base];
      if(existing.has(id)){skipped++;continue}
      S.tx.push({id,src:'tricount',date,desc,amt,total,paidBy:iPaid>=0?r[iPaid].trim():'',cur,cat:categorize(desc,S.learn),ex:false,dup:false});existing.add(id);added++}
  }
  reconcile(S.tx);
  return{added,skipped,src,warn,noMe:src==='tricount'&&!S.me}}
function reconcile(tx){
  tx.forEach(t=>{t.dup=false;delete t.dupOf});
  const used=new Set(),tri=tx.filter(t=>t.src==='tricount'&&t.total);
  for(const r of tx){if(r.src!=='revolut'||r.keep)continue;
    const m=tri.find(t=>!used.has(t.id)&&Math.abs(t.total-r.amt)<0.011&&Math.abs(diffDays(t.date,r.date))<=3);
    if(m){used.add(m.id);r.dup=true;r.dupOf=m.id}}}
const counted=t=>!t.dup&&!t.ex;
function sumR(tx,from,to,f){let s=0;for(const t of tx)if(counted(t)&&t.date>=from&&t.date<=to&&(!f||f(t)))s+=t.amt;return Math.round(s*100)/100}
function pct(cur,prev){return prev>0?(cur-prev)/prev*100:null}
function periods(tx,today){
  const ws=weekStart(today),el=diffDays(today,ws),pws=addDays(ws,-7);
  const ms=monthStart(today),dd=toD(today).getDate(),pms=addMonths(today,-1),pme=addDays(ms,-1),pend=addDays(pms,Math.min(dd,dim(pms))-1);
  return{
    day:sumR(tx,today,today),dayPrev:sumR(tx,addDays(today,-1),addDays(today,-1)),
    week:sumR(tx,ws,today),weekPrev:sumR(tx,pws,addDays(pws,el)),weekPrevFull:sumR(tx,pws,addDays(ws,-1)),
    month:sumR(tx,ms,today),monthPrev:sumR(tx,pms,pend),monthPrevFull:sumR(tx,pms,pme),
    forecast:Math.round(sumR(tx,ms,today)/dd*dim(today)),ws,ms,pws,pms,pme,pend,dd}}
function byCat(tx,from,to){const o={};for(const t of tx)if(counted(t)&&t.date>=from&&t.date<=to)o[t.cat]=(o[t.cat]||0)+t.amt;return o}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function findSubs(tx,today){
  const g={};for(const t of tx)if(counted(t)&&t.src!=='tricount'){(g[normKey(t.desc)]=g[normKey(t.desc)]||[]).push(t)}
  const out=[];
  for(const k in g){const a=g[k].sort((x,y)=>x.date<y.date?-1:1);if(a.length<2)continue;
    const am=median(a.map(t=>t.amt));if(!a.every(t=>Math.abs(t.amt-am)<=am*0.1+0.01))continue;
    const gaps=[];for(let i=1;i<a.length;i++)gaps.push(diffDays(a[i].date,a[i-1].date));const mg=median(gaps);
    if(mg<26||mg>35)continue;
    const last=a[a.length-1].date;let next=addDays(last,Math.round(mg));while(next<today)next=addDays(next,30);
    out.push({name:a[a.length-1].desc,amt:am,last,next,count:a.length,cat:a[0].cat})}
  return out.sort((x,y)=>y.amt-x.amt)}

  if(typeof o==='string')return o.length>40&&/^[A-Za-z0-9+/_=\-\s]+$/.test(o)?o:null;

function fileToCsv(res,f){

function extractTricountKey(raw){

  if(!s)return'';

    const u=new URL(/^https?:\/\//i.test(s)?s:`https://tricount.com/${s.replace(/^\/+/,'')}`);

function genUUID(){
  if(typeof crypto!=='undefined'&&crypto.randomUUID)return crypto.randomUUID();
  return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)});
}

async function generateRsaPublicKeyPem(){
  if(!window.crypto||!window.crypto.subtle)throw new Error("Ce navigateur bloque WebCrypto (ouvre l'application via https:// et non en fichier local).");
  const kp=await crypto.subtle.generateKey(
    {name:'RSASSA-PKCS1-v1_5',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},
    true,
    ['sign','verify']
  );
  const spki=await crypto.subtle.exportKey('spki',kp.publicKey);
  const bytes=new Uint8Array(spki);
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  const b64=btoa(bin).match(/.{1,64}/g).join('\n');
  return`-----BEGIN PUBLIC KEY-----\n${b64}\n-----END PUBLIC KEY-----`;
}

function buildProxyUrls(url,cfg){
  const list=[];
  const custom=(cfg.customProxy||'').trim();
  if(custom){
    if(custom.includes('{url}'))list.push(custom.replace('{url}',encodeURIComponent(url)));
    else if(custom.endsWith('?')||custom.endsWith('='))list.push(custom+url);
    else list.push(custom.replace(/\/+$/,'')+'/?url='+encodeURIComponent(url));
  }
  if(cfg.corsProxy){
    // Corsfix accepte POST, OPTIONS preflight et en-têtes personnalisés sans clé API
    list.push(`https://proxy.corsfix.com/?${url}`);
  }
  return list;
}

async function tcFetchJson(url,opts,cfg){
  const doCall=async targetUrl=>{
    const r=await fetch(targetUrl,opts);
    const txt=await r.text();
    const json=safeJSON(txt);
    if(!r.ok){
      const apiMsg=json&&json.Error&&json.Error[0]&&json.Error[0].error_description;
      throw new Error(apiMsg||`Erreur serveur HTTP ${r.status}`);
    }
    if(!json)throw new Error('Réponse non JSON reçue du relais.');
    return json;
  };
  const targets=[...buildProxyUrls(url,cfg),url];
  let lastErr=null;
  for(const t of targets){
    try{return await doCall(t)}catch(err){lastErr=err}
  }
  throw lastErr||new Error('Échec de connexion réseau');
}

async function getTricountSession(cfg,forceNew=false){
  if(!forceNew&&cfg.session&&cfg.session.token&&cfg.session.userId&&cfg.session.appId){
    return cfg.session;
  }
  const appId=genUUID();
  const pubPem=await generateRsaPublicKeyPem();
  const res=await tcFetchJson(`${TC_API}/v1/session-registry-installation`,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'app-id':appId,
      'X-Bunq-Client-Request-Id':genUUID()
    },
    body:JSON.stringify({
      app_installation_id:appId,
      client_public_key:pubPem,
      device_description:'CapDepenses Web'
    })
  },cfg);
  const items=res.Response||[];
  const tokObj=items.find(x=>x.Token);
  const usrObj=items.find(x=>x.UserPerson);
  if(!tokObj||!usrObj)throw new Error('Impossible d’ouvrir une session Tricount.');
  cfg.session={token:tokObj.Token.token,userId:usrObj.UserPerson.id,appId};
  return cfg.session;
}

    if(!rawDate||isNaN(amtVal)||amtVal<=0)continue;
    const cur=(e.amount&&e.amount.currency)||registry.currency||'EUR';
    const paidBy=memberDisplayName(e.membership_owned);
    const txType=e.type_transaction||'';
    const shareMap={};
    for(const al of(e.allocations||[])){
      const who=memberDisplayName(al.membership);
      const val=al.amount&&al.amount.value!=null?Math.abs(parseFloat(al.amount.value)):0;
      if(who)shareMap[who]=(shareMap[who]||0)+val;
    }
    const row=[
      rawDate,
      title,
      amtVal.toFixed(2),
      cur,
      paidBy,
      txType,
      ...uniqMembers.map(m=>shareMap[m]!=null?shareMap[m].toFixed(2):'0')
    ];
    lines.push(row.map(csvEsc).join(','));
  }
  return lines.join('\n');
}

async function syncTricountDirect(isAuto=false){
  const cfg=tcCfg();
  if(tcBusy)return;
  const key=extractTricountKey(cfg.url);
  if(!key){
    if(!isAuto){cfg.err='Colle ton lien de partage Tricount (ex. https://tricount.com/...) avant de synchroniser.';save();render()}
    return;
  }
  tcBusy=true;
  cfg.err='';
  render();
  try{
    let sess=await getTricountSession(cfg,false);
    let data;
    try{
      data=await tcFetchJson(`${TC_API}/v1/user/${sess.userId}/registry?public_identifier_token=${encodeURIComponent(key)}`,{
        method:'GET',
        headers:{
          'app-id':sess.appId,
          'X-Bunq-Client-Request-Id':genUUID(),
          'X-Bunq-Client-Authentication':sess.token
        }
      },cfg);
    }catch(firstErr){
      sess=await getTricountSession(cfg,true);
      data=await tcFetchJson(`${TC_API}/v1/user/${sess.userId}/registry?public_identifier_token=${encodeURIComponent(key)}`,{
        method:'GET',
        headers:{
          'app-id':sess.appId,
          'X-Bunq-Client-Request-Id':genUUID(),
          'X-Bunq-Client-Authentication':sess.token
        }
      },cfg);
    }
    const regItem=(data.Response||[]).find(x=>x.Registry);
    if(!regItem||!regItem.Registry)throw new Error('Groupe Tricount introuvable. Vérifie que le lien de partage est bien actif.');
    const csvText=registryToCsv(regItem.Registry);
    if(S.demo){S.tx=S.tx.filter(t=>!String(t.id).startsWith('demo'));S.demo=false}
    const r=importText(csvText,'tricount',S);
    cfg.lastSync=Date.now();
    cfg.err='';
    const groupTitle=regItem.Registry.title?`« ${regItem.Registry.title} » : `:'';
    cfg.msg=`${groupTitle}${r.added} nouvelle${r.added>1?'s':''} dépense${r.added>1?'s':''} importée${r.added>1?'s':''} (${r.skipped} déjà présente${r.skipped>1?'s':''}).`+(r.noMe?' Indique ton prénom Tricount pour ta part exacte.':'');
    save();
  }catch(e){
    const m=e&&e.message?e.message:'erreur réseau';
    cfg.err=/Failed to fetch|NetworkError|Load failed/i.test(m)
      ?`Blocage réseau/CORS (${m}). Vérifie que l'application est ouverte en HTTPS et non en fichier local, ou renseigne ton relais Cloudflare ci-dessous.`
      :'Tricount : '+m;
    save();
  }finally{
    tcBusy=false;
    const ae=document.activeElement;
    if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
  }
}

function checkDailyTricountSync(){
  const cfg=tcCfg();
  if(!cfg.enabled||!cfg.url||!cfg.url.trim()||tcBusy)return;
  if(Date.now()-(cfg.lastSync||0)>=DAY_MS){
    syncTricountDirect(true);
  }
}

  <div class="field"><label for="srcsel">Source</label><select id="srcsel"><option value="auto">Détection automatique</option><option value="revolut">Revolut</option><option value="tricount">Tricount</option></select></div>
  <div class="field"><label for="files">Fichiers (.csv, .xlsx)</label><input type="file" id="files" accept=".csv,.txt,.xlsx,.xls" multiple></div>
  <div class="field"><label for="paste">Ou colle le contenu CSV</label><textarea id="paste" placeholder="Type,Product,Started Date,Completed Date,Description,Amount,Fee,Currency,State,Balance"></textarea></div>
  <button class="btn" data-act="importpaste">Importer le texte collé</button>
  <div id="impmsg" class="small" aria-live="polite">${impMsg}</div></section>
  <section class="card stack"><h2 style="margin:0">Budgets mensuels</h2><div class="field"><label for="bg">Budget global (€)</label><input type="number" id="bg" inputmode="decimal" value="${S.budgets.global||''}"></div>
  ${CATS.filter(c=>c!=='Autre').map(c=>`<div class="field"><label for="bc-${c}">${c}</label><input type="number" inputmode="decimal" id="bc-${c}" data-cat="${c}" class="bcat" value="${S.budgets.cats[c]||''}" placeholder="Pas de budget"></div>`).join('')}</section>
  <section class="card stack"><h2 style="margin:0">Notifications</h2>
  <div class="field"><label for="pct">M'alerter à ce pourcentage du budget</label><input type="number" id="pct" inputmode="numeric" value="${S.pct}" min="10" max="100"></div>
  <div class="field"><label for="jump">Alerte si la semaine dépasse la précédente de (%)</label><input type="number" id="jump" inputmode="numeric" value="${S.jump}" min="5" max="200"></div>
  <div class="row between"><span class="small">Notifications du système : <b>${perm==='granted'?'activées':perm==='denied'?'refusées':perm==='default'?'non activées':'indisponibles ici'}</b></span><button class="btn sec sm" data-act="perm">Activer</button></div>
  <p class="note" style="margin:0">Les alertes s'affichent toujours sur l'accueil. Les notifications push en arrière-plan demandent l'application installée avec un serveur.</p></section>
  ${used.length?`<section class="card stack"><h2 style="margin:0">Taux de change vers l'euro</h2>${used.map(c=>`<div class="field"><label for="r-${c}">1 ${esc(c)} en €</label><input type="number" step="0.0001" inputmode="decimal" id="r-${c}" data-cur="${esc(c)}" class="rate" value="${S.rates[c]??1}"></div>`).join('')}<p class="note" style="margin:0">Taux fixes à mettre à jour toi-même. Ils s'appliquent aux prochains imports.</p></section>`:''}
  <section class="card stack"><h2 style="margin:0">Données</h2><div class="row" style="flex-wrap:wrap"><button class="btn sec sm" data-act="demo">Recharger l'exemple</button><button class="btn danger sm" data-act="wipe">Tout effacer</button></div><p class="note" style="margin:0">${S.tx.length} dépenses enregistrées sur cet appareil et ce navigateur.</p></section>`}
function openSheet(id){
  const isNew=!id,x=isNew?{id:'m'+Date.now(),src:'manuel',date:todayStr(),desc:'',amt:0,cat:'Autre',cur:'EUR',ex:false,dup:false}:S.tx.find(t=>t.id===id);if(!x)return;
  const d=document.createElement('div');d.className='sheet';d.id='sheet';
  d.innerHTML=`<div class="panel stack" role="dialog" aria-label="${isNew?'Nouvelle dépense':'Modifier la dépense'}"><h2 style="margin:0">${isNew?'Nouvelle dépense':'Modifier'}</h2>
  ${x.dup?`<div class="alert info"><div><b>Doublon probable</b><span class="small muted">Ce paiement Revolut correspond à une dépense Tricount. Seule ta part Tricount est comptée.</span></div></div>`:''}
  <div class="field"><label for="e-desc">Description</label><input type="text" id="e-desc" value="${esc(x.desc)}"></div>
  <div class="grid2"><div class="field"><label for="e-amt">Montant (€)</label><input type="number" step="0.01" inputmode="decimal" id="e-amt" value="${x.amt}"></div><div class="field"><label for="e-date">Date</label><input type="date" id="e-date" value="${x.date}"></div></div>
  <div class="field"><label for="e-cat">Catégorie</label><select id="e-cat">${CATS.map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="field"><label for="e-note">Note</label><input type="text" id="e-note" value="${esc(x.note||'')}"></div>
  <label class="row small"><input type="checkbox" id="e-ex" ${x.ex?'checked':''}> Dépense exceptionnelle (exclue des statistiques)</label>
  ${x.src==='revolut'&&(x.dup||x.keep)?`<label class="row small"><input type="checkbox" id="e-keep" ${x.keep?'checked':''}> Compter quand même ce paiement</label>`:''}
  <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="saveedit" data-id="${isNew?'':esc(x.id)}">Enregistrer</button><button class="btn sec" data-act="closesheet">Annuler</button>${isNew?'':`<button class="btn danger" data-act="del" data-id="${esc(x.id)}">Supprimer</button>`}</div></div>`;
  d.addEventListener('click',e=>{if(e.target===d)d.remove()});document.body.appendChild(d);$('e-desc').focus()}
function saveEdit(id){
  let x=S.tx.find(t=>t.id===id);const isNew=!x;if(isNew)x={id:'m'+Date.now(),src:'manuel',cur:'EUR',dup:false};
  const old=x.cat;x.desc=$('e-desc').value.trim()||'Sans titre';x.amt=Math.max(0,parseFloat($('e-amt').value)||0);x.date=parseDate($('e-date').value)||todayStr();x.cat=$('e-cat').value;x.note=$('e-note').value;x.ex=$('e-ex').checked;
  if($('e-keep'))x.keep=$('e-keep').checked;
  if(isNew)S.tx.push(x);
  if(!isNew&&x.cat!==old){const k=normKey(x.desc);if(k){S.learn[k]=x.cat;S.tx.forEach(t=>{if(normKey(t.desc)===k)t.cat=x.cat})}}
  reconcile(S.tx);save();$('sheet').remove();render()}
function notify(t){
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  try{for(const a of computeAlerts(S,t)){const k=a.id+t;if(S.notified[k])continue;S.notified[k]=1;new Notification(a.t,{body:a.d})}save()}catch(e){}}
/* ---------- Lecture automatique Revolut depuis Google Drive (capacité mcp) ---------- */
let MCP=null;const unsub={};const dstat={revolut:'',msg:'',busy:false,at:0};
const DKEYS=['revolut'];
function drv(){if(!S.drive||typeof S.drive!=='object')S.drive={enabled:false,revolut:'revolut',seen:{}};if(!S.drive.seen)S.drive.seen={};return S.drive}
async function importDriveFile(f,src){
  const d=drv();if(d.seen[f.id]===(f.modifiedTime||''))return null;
  let res=await MCP.callTool(DRV,'download_file_content',{fileId:f.id});
  let text=fileToCsv(res,f);
  if(!text){const r2=await MCP.callTool(DRV,'read_file_content',{fileId:f.id});text=typeof r2.payload==='string'?r2.payload:((r2.content||[]).find(c=>c.type==='text')||{}).text}
  if(!text)throw new Error('contenu illisible');
  if(S.demo){S.tx=S.tx.filter(t=>!String(t.id).startsWith('demo'));S.demo=false}
  const r=importText(text,src,S);d.seen[f.id]=f.modifiedTime||'';
  return`${r.added} nouvelle${r.added>1?'s':''} dépense${r.added>1?'s':''} depuis ${f.title}`}
async function driveBatch(src,files){
  const fresh=files.filter(f=>f&&f.id&&drv().seen[f.id]!==(f.modifiedTime||'')).slice(0,10);
  dstat[src]='';if(!fresh.length)return;
  dstat.busy=true;const out=[];
  for(const f of fresh){try{const m=await importDriveFile(f,src);if(m)out.push(m)}catch(e){out.push(`${f.title} : ${e.code?driveErr(e):e.message}`)}}
  dstat.busy=false;dstat.at=Date.now();if(out.length)dstat.msg=out.join(' · ');
  save();const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render()}
function startDrive(){
  if(!MCP||!drv().enabled)return;
  for(const src of DKEYS){const kw=drv()[src];if(unsub[src]){unsub[src]();unsub[src]=null}if(!kw)continue;
    try{unsub[src]=MCP.watchTool(DRV,'search_files',{query:dq(kw),orderBy:'modifiedTime desc',pageSize:10,excludeContentSnippets:true},ev=>{
      if(ev.type==='data')driveBatch(src,pickFiles(ev.result));
      else{dstat[src]=driveErr(ev.error);if(tab==='reglages')render()}},{refetchInterval:60000})}catch(e){dstat[src]=driveErr(e)}}}
async function driveConnect(){
  if(!MCP)return;drv().enabled=true;save();dstat.revolut='';
  try{await MCP.callTool(DRV,'search_files',{query:dq(drv().revolut||'revolut'),pageSize:1,excludeContentSnippets:true},{cache:false});startDrive()}
  catch(e){dstat.revolut=driveErr(e);if(e&&e.code!=='approval_required'&&e.code!=='not_in_manifest'){}else drv().enabled=false;save()}
  render()}
async function driveRefresh(){if(!MCP||!drv().enabled)return;try{await MCP.invalidate(DRV,'search_files')}catch(e){}
  for(const src of DKEYS){const kw=drv()[src];if(!kw)continue;try{const r=await MCP.callTool(DRV,'search_files',{query:dq(kw),orderBy:'modifiedTime desc',pageSize:10,excludeContentSnippets:true},{cache:false});await driveBatch(src,pickFiles(r))}catch(e){dstat[src]=driveErr(e);render()}}}
async function handleFiles(fl){
  const out=[];
  for(const f of fl){try{let text;
    if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX)throw new Error("lecteur Excel indisponible, exporte plutôt en CSV");const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});text=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]])}
    else text=await f.text();
    out.push(runImport(text,f.name))}catch(e){out.push(`<b>${esc(f.name)}</b> : ${esc(e.message)}`)}}
  impMsg=out.join('<br>');save();render()}
function runImport(text,name){
  const hint=$('srcsel')?$('srcsel').value:'auto';
  if(S.demo){S.tx=S.tx.filter(t=>!String(t.id).startsWith('demo'));S.demo=false}
  const r=importText(text,hint,S);
  return`<b>${esc(name)}</b> (${r.src==='revolut'?'Revolut':'Tricount'}) : ${r.added} ajoutées, ${r.skipped} ignorées (revenus, doublons, virements internes).`+(r.warn.length?` Taux inconnu pour ${esc(r.warn.join(', '))} : réglé à 1, corrige-le plus bas.`:'')+(r.noMe?' Indique ton prénom Tricount pour calculer ta part exacte.':'')}
function ask(q){q=q.trim();if(!q)return;chat.push({me:true,t:q});chat.push({t:answer(q,S,todayStr())});render();const i=$('chatin');if(i)i.focus()}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.tab;render();window.scrollTo(0,0)}
  else if(a==='edit')openSheet(b.dataset.id);
  else if(a==='add')openSheet('');
  else if(a==='closesheet')$('sheet').remove();
  else if(a==='saveedit')saveEdit(b.dataset.id);
  else if(a==='del'){const x=S.tx.find(t=>t.id===b.dataset.id);if(x&&(x.src==='revolut'||x.src==='tricount')&&!String(x.id).startsWith('demo'))x.ex=true;else S.tx=S.tx.filter(t=>t.id!==b.dataset.id);reconcile(S.tx);save();$('sheet').remove();render()}
  else if(a==='tcsync'){
    if($('tcurl'))tcCfg().url=$('tcurl').value.trim();
    if($('tccustom'))tcCfg().customProxy=$('tccustom').value.trim();
    if($('me'))S.me=$('me').value.trim();
    if($('tcenabled'))tcCfg().enabled=$('tcenabled').checked;
    if($('tcproxy'))tcCfg().corsProxy=$('tcproxy').checked;
    save();
    syncTricountDirect(false);
  }
  else if(a==='driveon')driveConnect();
  else if(a==='driverefresh')driveRefresh();
  else if(a==='driveoff'){drv().enabled=false;for(const k of DKEYS){if(unsub[k]){unsub[k]();unsub[k]=null}}save();render()}
  else if(a==='ask')ask(b.dataset.q);
  else if(a==='importpaste'){try{impMsg=runImport($('paste').value,'Texte collé')}catch(err){impMsg='Texte collé : '+esc(err.message)}save();render()}
  else if(a==='perm'){try{await Notification.requestPermission()}catch(err){}render()}
  else if(a==='demo'){S=Object.assign(defaults(true),{budgets:S.budgets,me:S.me,tricountSync:S.tricountSync});save();render()}
  else if(a==='wipe'){if(b.dataset.sure){S.tx=[];S.demo=false;S.learn={};save();render()}else{b.dataset.sure='1';b.textContent='Confirmer : tout supprimer'}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='files'){handleFiles(t.files)}
  else if(t.id==='tcurl'){tcCfg().url=t.value.trim();save()}
  else if(t.id==='tccustom'){tcCfg().customProxy=t.value.trim();save()}
  else if(t.id==='tcenabled'){tcCfg().enabled=t.checked;save();if(t.checked)checkDailyTricountSync();render()}
  else if(t.id==='tcproxy'){tcCfg().corsProxy=t.checked;save()}
  else if(t.id==='me'){S.me=t.value.trim();save()}
  else if(t.id==='dkrev'){drv().revolut=t.value.trim();save();startDrive()}
  else if(t.id==='bg'){S.budgets.global=parseFloat(t.value)||0;save()}
  else if(t.classList.contains('bcat')){const v=parseFloat(t.value);if(v>0)S.budgets.cats[t.dataset.cat]=v;else delete S.budgets.cats[t.dataset.cat];save()}
  else if(t.id==='pct'){S.pct=Math.min(100,Math.max(10,parseInt(t.value)||80));save()}
  else if(t.id==='jump'){S.jump=Math.max(5,parseInt(t.value)||25);save()}
  else if(t.classList.contains('rate')){S.rates[t.dataset.cur]=parseFloat(t.value)||1;save()}
  else if(['fsrc','fcat','fsort','fscope'].includes(t.id)){F[t.id.slice(1)]=t.value;rTxList()}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;rTxList()}});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();ask($('chatin').value)}});

reconcile(S.tx);
render();
checkDailyTricountSync();
setInterval(checkDailyTricountSync,15*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDailyTricountSync()});
try{if(window.claude&&window.claude.use)window.claude.use('mcp').then(m=>{if(m){MCP=m;render();startDrive()}}).catch(()=>{})}catch(e){}
</script>
</body>
</html>
